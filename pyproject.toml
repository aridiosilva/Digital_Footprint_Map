[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapa-pegada-digital"
version = "1.0.0"
description = "Coletor auditável e gerador de mapa da pegada digital"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
notion = ["notion-client>=2.2,<3"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
pegada = "pegada.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
